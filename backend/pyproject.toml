[project]
name = "thermalloop-backend"
version = "0.1.0"
description = "Physics-based digital twin backend for the ThermalLoop AI Center."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["thermalloop*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"
